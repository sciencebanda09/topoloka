# Builds the web viewer and deploys it to GitHub Pages.
#
# Artifacts: web/public/artifacts/* is gitignored (large pipeline outputs).
# The committed sample capture lives in test/house_v1/web/ and is copied into
# web/public/artifacts/house_v1/ here before the build, so the deployed viewer
# can serve ?capture=house_v1 without any duplicate data in git.
name: web-pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'test/house_v1/web/**', '.github/workflows/web-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Stage committed sample capture
        if: ${{ hashFiles('test/house_v1/web/nav.json') != '' }}
        working-directory: .
        run: |
          mkdir -p web/public/artifacts/house_v1
          cp -r test/house_v1/web/. web/public/artifacts/house_v1/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - uses: actions/deploy-pages@v4
