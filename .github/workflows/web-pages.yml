# Builds the web viewer and deploys it to GitHub Pages.
#
# NOTE: web/public/artifacts/* is gitignored (large pipeline outputs). For this
# workflow to deploy a usable viewer, commit a demo capture under
# web/public/artifacts/<name>/ (git add -f) or extend this workflow to fetch
# the artifact bundle from Kaggle/another store first.
name: web-pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - uses: actions/deploy-pages@v4
