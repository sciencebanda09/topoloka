<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Topoloka — indoor twins in a link</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b0f14'/><circle cx='16' cy='16' r='7' fill='none' stroke='%237fd4ff' stroke-width='3'/></svg>"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>

      <div id="hud">
        <div id="title">TOPOLOKA</div>
        <div id="subtitle">loading…</div>
        <label id="scene-picker">
          <span>VIEW SAMPLE</span>
          <select id="capture-select" aria-label="Choose a sample capture">
            <option value="guildhall-v2">Guildhall · improved</option>
            <option value="guildhall-v1">Guildhall · original</option>
            <option value="metro_v1">Melbourne Metro</option>
          </select>
        </label>
      </div>

      <div id="map-wrap">
        <canvas id="minimap"></canvas>
        <div id="map-legend">
          <span><i class="sw-free"></i>free</span>
          <span><i class="sw-obstacle"></i>obstacle</span>
          <span><i class="sw-unknown"></i>unknown</span>
          <span><i class="sw-path"></i>path</span>
          <span id="legend-route" style="display:none"><i class="sw-route"></i>route</span>
          <span id="legend-prop" style="display:none"><i class="sw-prop"></i>prop</span>
        </div>
      </div>

      <div id="help">
        <b>WASD</b> walk · <b>mouse</b> look · <b>shift</b> faster · <b>M</b> map · <b>P</b> points · <b>click</b> to capture mouse
      </div>

      <div id="center-hint">click to enter walkthrough</div>

      <div id="reticle" class="hidden"></div>
      <div id="reticle-label" class="hidden"></div>
      <div id="carry-hint" class="hidden"></div>
      <div id="toast"></div>

      <div id="sandbox" class="hidden">
        <div class="sb-head">
          <span>SANDBOX <em id="sandbox-count">0 placed</em></span>
          <button id="sandbox-close" title="Exit (G)" aria-label="Exit sandbox">×</button>
        </div>
        <div id="prop-palette">
          <button data-prop="cone"><kbd>1</kbd> Cone</button>
          <button data-prop="barrier"><kbd>2</kbd> Barrier</button>
          <button data-prop="crate"><kbd>3</kbd> Crate</button>
          <button data-prop="sign"><kbd>4</kbd> Sign</button>
        </div>
        <div id="sandbox-carry-actions" class="hidden">
          <button id="sandbox-place">Place</button>
          <button id="sandbox-rotate">Rotate</button>
          <button id="sandbox-cancel">Cancel</button>
        </div>
        <div id="sandbox-actions">
          <button id="sandbox-route">Route to end</button>
          <button id="sandbox-clear">Clear</button>
          <button id="sandbox-share">Copy link</button>
        </div>
        <div id="sandbox-hint">
          <b>1–4</b> add · <b>click</b> pick/place · <b>R</b> rotate · <b>Del</b> remove · <b>T</b> route · <b>G</b> exit
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
